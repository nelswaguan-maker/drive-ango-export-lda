<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos — DRIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><header class="header"><a class="logo" href="index.html">DRIVE<small>GLOBAL CAR MARKET</small></a><a href="index.html">← Voltar</a></header><main class="results-section"><h1>Meus favoritos</h1><div id="favGrid" class="car-grid"></div></main><footer class="panel-copyright">© Angó Global Cars 2026 LTD</footer><script src="currency.js"></script><script>
const fav=JSON.parse(localStorage.getItem("driveFavs")||"[]"),cars=JSON.parse(localStorage.getItem("driveCars")||"[]");
const grid=document.getElementById("favGrid");const list=cars.filter(c=>fav.includes(c.id));grid.innerHTML=list.map(c=>`<article class="car-card ${c.status==='reserved'?'is-reserved':''} ${c.status==='sold'?'is-sold':''}"><img src="${c.image}"><div class="info"><small>${c.year} · ${c.brand}</small><h3>${c.model}</h3><div class="price">${driveFormatMoney(c.price)}</div><a class="details-btn" href="detalhes.html?id=${encodeURIComponent(c.id)}">Ver detalhes</a></div></article>`).join("")||"<p>Ainda não tens carros favoritos.</p>";
</script></body></html>
